name: Offline reproducibility checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/run_tests.py
      - run: python tools/replay_public_results.py
      - run: python tools/release_project.py
